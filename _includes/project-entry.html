<article class="project-entry">
<h2><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h2>
{% if project.area %}<p class="project-label">{{ project.area }} · {{ project.period }}</p>{% endif %}
<p>{{ project.excerpt | strip_html }}</p>
{% if project.map_preview %}{% include map-preview.html %}{% endif %}
</article>

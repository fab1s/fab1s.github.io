<article class="project-entry">
  <h3><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h3>
  {% if project.period %}<p class="project-label">{{ project.area }} · {{ project.period }}</p>{% endif %}
  <p>{{ project.excerpt | strip_html }}</p>
  {% if project.map_preview %}{% include map-preview.html %}{% endif %}
</article>

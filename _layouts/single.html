---
layout: default
---

{% include base_path %}

<div id="main" role="main">
  {% include sidebar.html %}

  <article class="page{% if page.contents %} page-with-contents{% endif %}" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap">
      <header>
        {% if page.title %}<h1 class="page__title" itemprop="headline">{{ page.title }}</h1>{% endif %}
      </header>

      {% if page.contents %}
        <nav class="page-contents" aria-labelledby="page-contents-label">
          <p class="page-contents__label" id="page-contents-label">On this page</p>
          <ul>
            {% for section in page.contents %}
              <li><a href="#{{ section | slugify }}">{{ section | escape }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      {% endif %}

      <section class="page__content" itemprop="text">
        {{ content }}
      </section>
    </div>
  </article>
</div>
